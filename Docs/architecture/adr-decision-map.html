<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نقشه تصمیم‌های معماری آرکا</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #17211d;
      --muted: #64716a;
      --line: #d8ddd7;
      --green: #1f6b4f;
      --green-soft: #dfeee7;
      --amber: #95620b;
      --amber-soft: #fff0c7;
      --blue: #245d78;
      --blue-soft: #dfedf3;
      --red: #94443d;
      --red-soft: #f7e3df;
      --shadow: 0 18px 50px rgba(30, 46, 38, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 0%, rgba(31,107,79,.11), transparent 30rem),
        var(--bg);
      font-family: Tahoma, "Segoe UI", sans-serif;
      line-height: 1.75;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid rgba(31,107,79,.28); outline-offset: 3px; }
    a { color: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 56px 0 28px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: .82rem; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; max-width: 760px; font-size: clamp(2rem, 5vw, 4.4rem); line-height: 1.15; letter-spacing: -.04em; }
    .lead { max-width: 780px; margin: 20px 0 0; color: var(--muted); font-size: 1.05rem; }
    .flow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 32px;
    }
    .flow-card { position: relative; padding: 18px; border: 1px solid var(--line); background: rgba(255,253,248,.78); border-radius: 18px; }
    .flow-card:not(:last-child)::after { content: "←"; position: absolute; left: -20px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 800; }
    .flow-card strong { display: block; font-size: 1.05rem; }
    .flow-card span { color: var(--muted); font-size: .88rem; }
    .review-guide { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; margin-top: 18px; padding: 16px 18px; border: 1px solid #cbd8d0; border-radius: 16px; background: var(--green-soft); }
    .review-guide svg { width: 24px; height: 24px; color: var(--green); }
    .review-guide strong { display: block; margin-bottom: 3px; }
    .review-guide p { margin: 0; color: #43574d; font-size: .9rem; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 14px 0;
      background: rgba(244,241,234,.9);
      backdrop-filter: blur(16px);
    }
    .search { width: 100%; padding: 13px 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--paper); outline: none; }
    .search:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,107,79,.12); }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .btn:hover { border-color: var(--green); }
    .btn.active { color: #fff; border-color: var(--green); background: var(--green); }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 24px; }
    .stat { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.55); font-size: .88rem; }
    .stat b { color: var(--ink); }
    .list { display: grid; gap: 14px; padding-bottom: 64px; }
    .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: thin; }
    .category-btn { min-height: 44px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--paper); white-space: nowrap; cursor: pointer; }
    .category-btn.active { color: #fff; border-color: var(--green); background: var(--green); }
    .category-section { display: grid; gap: 14px; margin-bottom: 34px; }
    .category-heading { display: flex; justify-content: space-between; gap: 16px; align-items: end; padding: 0 4px; }
    .category-heading h2 { margin: 0; font-size: 1.35rem; }
    .category-heading p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
    .category-count { color: var(--muted); font-size: .82rem; white-space: nowrap; }
    .decision-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .decision-card { display: grid; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    .decision-card.reviewed { border-color: #a9cfba; }
    .decision-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .decision-title { margin: 0; font-size: 1.13rem; line-height: 1.5; }
    .decision-code { direction: ltr; flex: 0 0 auto; color: var(--green); font-size: .76rem; font-weight: 800; }
    .plain-facts { display: grid; gap: 10px; }
    .plain-fact { display: grid; grid-template-columns: 94px 1fr; gap: 10px; padding-top: 10px; border-top: 1px solid #edf0ec; }
    .plain-fact:first-child { border-top: 0; padding-top: 0; }
    .plain-fact strong { font-size: .8rem; }
    .plain-fact p { margin: 0; color: var(--muted); font-size: .88rem; }
    .plain-fact.open strong { color: var(--amber); }
    .plain-fact.next strong { color: var(--blue); }
    .card-footer { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .card-open { min-height: 44px; padding: 9px 14px; border: 0; border-radius: 11px; color: #fff; background: var(--green); cursor: pointer; }
    .tech-details { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; background: #faf9f5; }
    .tech-details > summary { display: flex; justify-content: space-between; padding: 14px 16px; font-weight: 800; }
    .tech-content { padding: 0 16px 16px; border-top: 1px solid var(--line); }
    .human-summary { display: grid; gap: 10px; margin-top: 16px; }
    .human-row { padding: 13px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
    .human-row strong { display: block; margin-bottom: 3px; font-size: .8rem; }
    .human-row p { margin: 0; color: var(--muted); }
    details.adr { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    details.adr[open] { border-color: #b8c9bf; }
    details.adr.reviewed { border-color: #b8d8c7; }
    summary { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 20px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .linked-record { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: hidden; }
    .linked-record > summary { display: block; padding: 14px 16px; }
    .linked-record > summary strong, .linked-record > summary span { display: block; }
    .linked-record > summary strong { color: var(--ink); }
    .linked-record > summary span { margin-top: 5px; color: var(--muted); font-size: .92rem; line-height: 1.8; }
    .linked-record > .modal-grid, .linked-record > .fact, .linked-record > .linked-label, .linked-record > .chips { margin-left: 16px; margin-right: 16px; }
    .linked-record > .modal-grid { margin-top: 0; }
    .linked-record > .linked-label { font-weight: 800; }
    .adr-id { min-width: 76px; padding: 7px 10px; border-radius: 10px; color: #fff; background: var(--green); direction: ltr; text-align: center; font-weight: 800; }
    .adr-title { min-width: 0; }
    .adr-title strong { display: block; font-size: 1.05rem; }
    .adr-title small { color: var(--muted); }
    .counts { display: flex; gap: 6px; }
    .count { padding: 5px 9px; border-radius: 999px; white-space: nowrap; font-size: .78rem; font-weight: 700; }
    .count.dl { color: var(--amber); background: var(--amber-soft); }
    .count.at { color: var(--blue); background: var(--blue-soft); }
    .count.reviewed { color: var(--green); background: var(--green-soft); }
    .detail-body { border-top: 1px solid var(--line); padding: 22px; background: #fff; }
    .meaning { margin: 0 0 20px; padding: 14px 16px; border-right: 4px solid var(--green); border-radius: 10px; background: var(--green-soft); }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .group { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .group-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 15px; background: #faf9f5; border-bottom: 1px solid var(--line); }
    .group-head h3 { margin: 0; font-size: .95rem; }
    .group-head span { color: var(--muted); font-size: .78rem; }
    .items { display: grid; }
    .item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 14px 15px; text-decoration: none; border-bottom: 1px solid #edf0ec; }
    button.item { width: 100%; border: 0; color: inherit; background: transparent; text-align: right; cursor: pointer; }
    .item:last-child { border-bottom: 0; }
    .item:hover { background: #fbfcfa; }
    .item-id { direction: ltr; font-weight: 800; font-size: .82rem; }
    .item.dl .item-id { color: var(--amber); }
    .item.at .item-id { color: var(--blue); }
    .item strong { display: block; font-size: .9rem; }
    .item small { color: var(--muted); font-size: .76rem; }
    .empty { padding: 18px; color: var(--muted); font-size: .86rem; }
    .inline-detail { padding: 0; border: 0; border-bottom: 1px dashed currentColor; color: var(--green); background: transparent; cursor: pointer; }
    dialog {
      width: min(720px, calc(100% - 28px));
      max-height: min(82vh, 760px);
      padding: 0;
      border: 1px solid #c9d4cd;
      border-radius: 22px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 28px 90px rgba(15,30,22,.28);
    }
    dialog::backdrop { background: rgba(16,25,20,.55); backdrop-filter: blur(5px); }
    .modal-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; padding: 22px 24px; border-bottom: 1px solid var(--line); background: #f8f7f2; }
    .modal-kicker { display: block; direction: ltr; text-align: right; color: var(--green); font-weight: 800; font-size: .82rem; }
    .modal-head h2 { margin: 3px 0 0; font-size: 1.3rem; }
    .modal-close { width: 38px; height: 38px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 50%; background: #fff; cursor: pointer; font-size: 1.3rem; line-height: 1; }
    .modal-body { overflow: auto; padding: 24px; }
    .modal-state { display: inline-flex; margin-bottom: 18px; padding: 6px 10px; border-radius: 999px; color: var(--amber); background: var(--amber-soft); font-size: .8rem; font-weight: 800; }
    .modal-state.at { color: var(--blue); background: var(--blue-soft); }
    .modal-state.adr { color: var(--green); background: var(--green-soft); }
    .modal-section { margin-top: 20px; }
    .modal-section h3 { margin: 0 0 8px; font-size: .9rem; }
    .modal-section p { margin: 0; color: var(--muted); }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fact { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .fact h3 { margin: 0 0 6px; font-size: .82rem; color: var(--ink); }
    .fact p { margin: 0; color: var(--muted); font-size: .88rem; white-space: pre-line; }
    .statement-list { display: grid; gap: 8px; }
    .statement { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 12px; }
    .statement-state { align-self: start; padding: 3px 7px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: .72rem; font-weight: 800; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { direction: ltr; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: #fff; font-size: .78rem; font-weight: 700; cursor: pointer; }
    .chip:hover { color: var(--green); border-color: var(--green); }
    .modal-actions { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line); background: rgba(255,253,248,.96); backdrop-filter: blur(10px); }
    .review-btn { padding: 10px 14px; border: 1px solid var(--green); border-radius: 11px; color: #fff; background: var(--green); cursor: pointer; }
    .review-btn.done { color: var(--green); background: var(--green-soft); }
    .record-note { margin: 0; color: var(--muted); font-size: .78rem; }
    footer { padding: 0 0 44px; color: var(--muted); font-size: .82rem; }
    .hidden { display: none !important; }
    @media (max-width: 760px) {
      .flow, .columns, .decision-grid { grid-template-columns: 1fr; }
      .modal-grid { grid-template-columns: 1fr; }
      .flow-card:not(:last-child)::after { content: "↓"; left: 50%; top: auto; bottom: -24px; transform: translateX(-50%); }
      .toolbar { grid-template-columns: 1fr; position: static; }
      .actions .btn { flex: 1; }
      summary { grid-template-columns: auto 1fr; }
      .counts { grid-column: 1 / -1; }
      .plain-fact { grid-template-columns: 1fr; gap: 2px; }
      .card-footer { align-items: stretch; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="جست‌وجوی موضوع، تصمیم، مسئله یا شناسه…" aria-label="جست‌وجو">
      <div class="actions">
        <button class="btn" id="unreviewedOnly" type="button" aria-pressed="false">فقط بررسی‌نشده‌ها</button>
      </div>
    </div>
    <nav class="category-nav" id="categoryNav" aria-label="گروه‌های تصمیم"></nav>
    <div class="stats" id="stats"></div>
    <section class="list" id="list" aria-live="polite"></section>
  </main>

  <footer class="shell">
    همه DLها باز و در انتظار Evidence هستند. همه ATها برنامه‌ریزی شده‌اند، اما هنوز اجرا نشده‌اند. این صفحه تصمیم جدیدی ایجاد نمی‌کند و فقط اطلاعات ثبت‌شده را یک‌جا نشان می‌دهد.
  </footer>

  <dialog id="recordModal" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div><span class="modal-kicker" id="modalId"></span><h2 id="modalTitle"></h2></div>
      <button class="modal-close" id="modalClose" type="button" aria-label="بستن">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions"><p class="record-note">وضعیت بررسی فقط در همین مرورگر ذخیره می‌شود.</p><button class="review-btn" id="reviewRecord" type="button">علامت‌گذاری به‌عنوان بررسی‌شده</button></div>
  </dialog>

  <script src="adr-decision-details.js"></script>
  <script>
    const adrTitles = {
      "ADR-01":"اجرای PostgreSQL و هم‌ارزی KPIهای مرجع",
      "ADR-02":"ورودی پذیرفته‌شده سفارش‌ها",
      "ADR-03":"وابستگی‌ها و محاسبه مجدد انتخابی",
      "ADR-04":"کامل‌بودن منبع و انتشار",
      "ADR-05":"اصلاح تاریخی و نسخه‌های گزارش",
      "ADR-06":"کنترل دسترسی و امنیت Query",
      "ADR-07":"حالت‌های مرزی Signal و Escalation",
      "ADR-08":"تقویم مدیریت و تقدم ورودی‌ها",
      "ADR-09":"وضعیت خروجی، دقت و اعداد ثبت‌شده",
      "ADR-10":"بودجه، مدل‌ها و محدودیت اجرا",
      "ADR-11":"تعارض اصلاحات و چرخه عمر موجودیت",
      "ADR-12":"نگهداری، پشتیبان‌گیری و ممیزی",
      "ADR-13":"یک AI Agent محدود",
      "ADR-14":"انتشار مستقل گزارش معتبر",
      "ADR-15":"مالکیت مراحل Workflow",
      "ADR-16":"فایل‌های زمان اجرا و اسناد عملیاتی",
      "ADR-17":"تصمیم انسانی و اجرای واقعی"
    };

    const adrMeaning = {
      "ADR-01":"PostgreSQL موتور محصول است؛ هم‌ارزی عددی همه ۵۵ KPI هنوز به مدرک نیاز دارد.",
      "ADR-02":"روش برخورد با سفارش‌های تکراری هنوز باید بین RAW و DEDUP تعیین شود.",
      "ADR-03":"بازسازی کامل مبنای صحت است؛ محاسبه انتخابی پس از اثبات هم‌ارزی قابل استفاده است.",
      "ADR-04":"گزارش ادامه دارد، اما مقدار جاری ناموجود باید null بماند و مسئله داده ثبت شود.",
      "ADR-05":"اصلاح داده تاریخی باید نسخه جدید بسازد و گزارش قبلی را بدون ردپا تغییر ندهد.",
      "ADR-06":"هر دسترسی و Query باید محدود، ثبت‌شده و مطابق نقش باشد.",
      "ADR-07":"قواعد Signal قطعی هستند، اما بعضی حالت‌های مرزی هنوز تصمیم لازم دارند.",
      "ADR-08":"زمان دریافت داده و تقدم ورودی‌ها تعیین می‌کند چه چیزی وارد هر گزارش می‌شود.",
      "ADR-09":"هر عدد منتشرشده باید تعریف، Query، Snapshot و دامنه قابل ردیابی داشته باشد.",
      "ADR-10":"هزینه روزانه و زمان اجرا محدود است؛ مدل و حدود دقیق هنوز انتخاب نشده‌اند.",
      "ADR-11":"رکوردهای اصلاحی متعارض باید قرنطینه شوند تا قاعده تقدم معتبر تعیین شود.",
      "ADR-12":"مدت نگهداری، Backup، دسترسی Audit و Restore هنوز قرارداد کامل لازم دارند.",
      "ADR-13":"فقط یک Agent محدود استفاده می‌شود؛ محاسبه و کنترل‌های حساس قطعی می‌مانند.",
      "ADR-14":"خرابی گزارش یک مدیر نباید مانع انتشار گزارش معتبر مدیر دیگر شود.",
      "ADR-15":"مالک Workflow با مالک مرحله فرق دارد؛ نگاشت مراحل هنوز باید تأیید شود.",
      "ADR-16":"دریافت ساختاریافته از اسناد عملیاتی و بازیابی متن آن‌ها جدا نگه داشته می‌شود.",
      "ADR-17":"تصمیم سازمانی با انسان است؛ سیستم فقط پیش‌نویس می‌سازد و اقدام را اجرا نمی‌کند."
    };

    const categories = {
      "all": { title:"همه موضوع‌ها", description:"نمای کامل ۱۷ موضوع تصمیم" },
      "data": { title:"داده و KPI", description:"محاسبه، کیفیت داده، اصلاحات و خروجی عددی" },
      "access": { title:"دسترسی و حاکمیت", description:"امنیت، نگهداری و فایل‌های عملیاتی" },
      "workflow": { title:"Signal، Workflow و اقدام", description:"تشخیص، زمان‌بندی، مالکیت و تصمیم انسانی" },
      "agent": { title:"Agent و عملیات", description:"مدل، هزینه، محدودیت اجرا و شکست گزارش" }
    };

    const decisionGuide = {
      "ADR-01": { category:"data", question:"چطور مطمئن شویم PostgreSQL همان نتیجه مرجع را می‌دهد؟", decided:"PostgreSQL تنها پایگاه داده محصول است و همه ۵۵ KPI و Queryهای سفارشی را اجرا می‌کند.", open:"هم‌ارزی عددی همه ۵۵ KPI، نوع ورودی‌ها، Median، NULL، زمان و گردکردن هنوز کامل اثبات نشده است.", next:"قرارداد تبدیل را ثبت کنید و نتایج همه صبح‌های Replay را با مرجع مقایسه کنید." },
      "ADR-02": { category:"data", question:"با سفارش‌های تکراری چه کنیم؟", decided:"داده منبع و همه رخدادهای ثبت‌شده باید حفظ شوند. حذف براساس order_id مجاز نیست.", open:"هنوز مشخص نیست محاسبه نهایی با RAW انجام شود یا تکرار دقیق Payload حذف شود. این انتخاب نتیجه ۸ KPI را تغییر می‌دهد.", next:"سیاست رسمی RAW یا DEDUP را دریافت کنید و نتیجه مورد انتظار را با AT-02 و AT-05 آزمایش کنید." },

      const labels = {

        "Requirement":"الزام قطعی (Requirement)",

        "Open":"موضوع باز (Open)",
        "آزمون پذیرش":"آزمون پذیرش"
      };
      return labels[label] || label;
    }

    function dlSourceFacts(row) {
      if (!row || row.length < 6) return "";
      return [
        fact("منبع مسئله", row[1]),
        fact("مسئله یا تصمیم مفقود", row[2]),
        fact("گزینه و اثر", row[3]),
        fact("مالک و آزمون مرتبط", row[4]),
        fact("مدرک لازم برای بستن", row[5])
      ].join("");
    }

        fact("مسئله دقیق", detail.conflict),
        fact("اثر مسئله", detail.effect),

        const sourceRow = detail.sourceRow || [];
        modalBody.innerHTML = `<span class="modal-state at">برنامه‌ریزی‌شده · اجرا‌نشده</span>
          <div class="modal-section"><h3>معیار اصلی پذیرش</h3><div class="fact"><h3>${safe(sourceRow[1] || ats[id])}</h3><p>${safe(sourceRow[2] || detail.evidence)}</p></div></div>
          <div class="modal-section"><h3>ADRهای مرتبط</h3>${chips(relations.adrIds)}</div>
          <div class="modal-section"><h3>DLهای مرتبط</h3>${chips(relations.dlIds)}</div>
          <div class="modal-section"><h3>وضعیت فعلی</h3><p>این آزمون برنامه‌ریزی شده است، اما هنوز اجرا نشده و Evidence نتیجه ثبت نشده است.</p></div>`;
      }
      updateReviewButton();
      modalBody.scrollTop = 0;
      if (!modal.open) modal.showModal();
    }

    function updateReviewButton() {
      const button = document.getElementById("reviewRecord");
      const isDone = currentRecord && reviewed.has(currentRecord.id);
      button.textContent = isDone ? "بررسی‌شده؛ بازگرداندن" : "علامت‌گذاری به‌عنوان بررسی‌شده";
      button.classList.toggle("done", Boolean(isDone));
    }

    function renderCategoryNav() {
      const nav = document.getElementById("categoryNav");
      nav.innerHTML = Object.entries(categories).map(([id, category]) => {
        const count = id === "all" ? Object.keys(decisionGuide).length : Object.values(decisionGuide).filter(item => item.category === id).length;
        return `<button class="category-btn ${activeCategory === id ? "active" : ""}" type="button" data-category="${id}" aria-pressed="${activeCategory === id}">${category.title} · ${faDigits(count)}</button>`;
      }).join("");
    }

    function decisionCard(id) {
      const guide = decisionGuide[id];
      const dlCount = relatedDl(id).length;
      const atCount = (directAt[id] || []).length;
      return `<article class="decision-card ${reviewed.has(id) ? "reviewed" : ""}">
        <div class="decision-top">
          <div><span class="decision-code">${id}</span><h3 class="decision-title">${safe(guide.question)}</h3></div>
          ${reviewed.has(id) ? `<span class="count reviewed">بررسی‌شده</span>` : ""}
        </div>
        <div class="plain-facts">
          <div class="plain-fact"><strong>تصمیم فعلی</strong><p>${safe(guide.decided)}</p></div>
          <div class="plain-fact open"><strong>موضوع باز</strong><p>${safe(guide.open)}</p></div>
          <div class="plain-fact next"><strong>قدم بعدی</strong><p>${safe(guide.next)}</p></div>
        </div>
        <div class="card-footer">
          <div class="card-meta"><span class="count dl">${faDigits(dlCount)} سؤال باز</span><span class="count at">${faDigits(atCount)} روش اثبات</span></div>
          <button class="card-open" type="button" data-kind="ADR" data-id="${id}">بررسی این موضوع</button>
        </div>
      </article>`;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      let shown = 0;
      const groups = Object.entries(categories).filter(([id]) => id !== "all" && (activeCategory === "all" || activeCategory === id));
      const sections = groups.map(([categoryId, category]) => {
        const ids = Object.keys(decisionGuide).filter(id => {
          const guide = decisionGuide[id];
          const dlRows = relatedDl(id);
          const atIds = directAt[id] || [];
          const haystack = [id, adrTitles[id], guide.question, guide.decided, guide.open, guide.next, ...dlRows.flatMap(([dlId,v]) => [dlId,v[0]]), ...atIds.flatMap(atId => [atId,ats[atId]])].join(" ").toLowerCase();
          return guide.category === categoryId && (!q || haystack.includes(q)) && (!onlyUnreviewed || !reviewed.has(id));
        });
        if (!ids.length) return "";
        shown += ids.length;
        return `<section class="category-section">
          <div class="category-heading"><div><h2>${category.title}</h2><p>${category.description}</p></div><span class="category-count">${faDigits(ids.length)} موضوع</span></div>
          <div class="decision-grid">${ids.map(decisionCard).join("")}</div>
        </section>`;
      }).join("");
      list.innerHTML = sections || `<div class="empty">موضوعی با این جست‌وجو یا فیلتر پیدا نشد.</div>`;
      const reviewedAdr = Object.keys(adrTitles).filter(id => reviewed.has(id)).length;
      stats.innerHTML = `<span class="stat"><b>${faDigits(shown)}</b> موضوع نمایش داده شده</span><span class="stat"><b>${faDigits(reviewedAdr)} از ۱۷</b> موضوع بررسی شده</span><span class="stat"><b>۱۹</b> سؤال باز</span><span class="stat"><b>۳۰</b> روش اثبات برنامه‌ریزی‌شده</span>`;
      renderCategoryNav();
    }

    search.addEventListener("input", render);
    document.getElementById("unreviewedOnly").addEventListener("click", event => {
      onlyUnreviewed = !onlyUnreviewed;
      event.currentTarget.classList.toggle("active", onlyUnreviewed);
      event.currentTarget.setAttribute("aria-pressed", String(onlyUnreviewed));
      render();
    });
    document.getElementById("categoryNav").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      render();
    });
    document.addEventListener("click", event => {
      const trigger = event.target.closest("[data-kind][data-id]");
      if (trigger) openRecord(trigger.dataset.kind, trigger.dataset.id);
    });
    document.getElementById("modalClose").addEventListener("click", () => document.getElementById("recordModal").close());
    document.getElementById("reviewRecord").addEventListener("click", () => {
      if (!currentRecord) return;
      if (reviewed.has(currentRecord.id)) reviewed.delete(currentRecord.id); else reviewed.add(currentRecord.id);
      persistReviewed();
      updateReviewButton();
      render();
    });
    document.getElementById("recordModal").addEventListener("click", event => {
      if (event.target === event.currentTarget) event.currentTarget.close();
    });
    render();
  </script>
</body>
</html>
