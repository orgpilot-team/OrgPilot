<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
<title id="title">نقشه یک‌صفحه‌ای سازمان و جریان‌های کاری آرکا</title>
<desc id="desc">نقشه ساختار سازمان، سه گردش کار اصلی، منابع داده، مسئله مدیریتی و حلقه تصمیم و پیگیری</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#10283A"/></linearGradient>
 <linearGradient id="hero" x2="1"><stop stop-color="#123951"/><stop offset="1" stop-color="#17435A"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020912" flood-opacity=".28"/></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#6c94a7" stroke-width="2"/></marker>
 <style>
  text{font-family:Tahoma,"Segoe UI",sans-serif;fill:#eaf3f6} .muted{fill:#a6bfca}.subtle{fill:#86a4b1}.title{font-size:55px;font-weight:700}.h2{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.tiny{font-size:15px}.bold{font-weight:700}.card{fill:#112b3d;stroke:#29495a;stroke-width:2}.chip{fill:#1a3b50;stroke:#315b70;stroke-width:1.5}.flow{fill:#122f42;stroke:#315c70;stroke-width:2}.line{fill:none;stroke:#628497;stroke-width:3;marker-end:url(#arr)}
 </style>
</defs>
<rect width="2400" height="1600" fill="url(#bg)"/>
<!-- Header -->
<text x="2280" y="82" text-anchor="end" class="small" fill="#71d6c2">نقشه عملیاتی سازمان • بر پایه بریف و داده‌های شبیه‌سازی‌شده</text>
<text x="2280" y="155" text-anchor="end" class="title">آرکا؛ از جذب تقاضا تا تحویل و رسیدگی</text>
<text x="2280" y="202" text-anchor="end" class="body muted">یک سازمان، سه گردش‌کار به‌هم‌پیوسته؛ داده‌ها در چند سامانه و میان چند مالک پخش شده‌اند.</text>
<!-- legend -->
<rect x="100" y="90" width="680" height="125" rx="22" fill="#0e2433" stroke="#29495a"/>
<text x="730" y="128" text-anchor="end" class="small bold">راهنمای نقشه</text>
<circle cx="155" cy="170" r="10" fill="#58c9b6"/><text x="180" y="177" class="small">تیم / مالک</text>
<rect x="355" y="159" width="22" height="22" rx="6" fill="#e6ad5c"/><text x="390" y="177" class="small">مرحله فرایند</text>
<path d="M570 170h52" stroke="#83a9bb" stroke-width="3" marker-end="url(#arr)"/><text x="640" y="177" class="small">جریان / ارجاع</text>
<!-- Main workflow panel -->
<rect x="100" y="245" width="2200" height="740" rx="30" fill="#0d2231" stroke="#29495a" stroke-width="2" filter="url(#shadow)"/>
<text x="2245" y="300" text-anchor="end" class="h2">سه گردش‌کار اصلی (Workflow)</text>
<text x="2245" y="334" text-anchor="end" class="small muted">نوار هر مرحله، زمان هدف / سقف SLA یا موعد کنترلی را نشان می‌دهد؛ مالکیت در طول مسیر بین تیم‌ها جابه‌جا می‌شود.</text>
<!-- Flow 1 -->
<rect x="145" y="365" width="2110" height="180" rx="22" fill="#102b3c" stroke="#287e79" stroke-width="2"/>
<rect x="2020" y="387" width="205" height="42" rx="20" fill="#174a4a"/><text x="2122" y="415" text-anchor="middle" class="small bold" fill="#83e0cb">WF1 • سفارش</text>
<text x="2220" y="467" text-anchor="end" class="h2">سفارش تا تحویل</text>
<text x="2220" y="503" text-anchor="end" class="small muted">فروش ← انبار ← ارسال ← پشتیبانی</text>
<g text-anchor="middle">
 <rect x="1510" y="405" width="235" height="82" rx="15" class="flow"/><text x="1627" y="439" class="body bold">ثبت سفارش</text><text x="1627" y="470" class="small muted">مشتری • وب / اپ / بازارگاه</text>
 <rect x="1235" y="405" width="235" height="82" rx="15" class="flow"/><text x="1352" y="439" class="body bold">پرداخت</text><text x="1352" y="470" class="small muted">هدف ≤ ۱ ساعت</text>
 <rect x="960" y="405" width="235" height="82" rx="15" class="flow"/><text x="1077" y="439" class="body bold">جمع‌آوری کالا</text><text x="1077" y="470" class="small muted">انبار • هدف ≤ ۱۲ ساعت</text>
 <rect x="685" y="405" width="235" height="82" rx="15" class="flow"/><text x="802" y="439" class="body bold">تحویل به ارسال</text><text x="802" y="470" class="small muted">ارسال • هدف ≤ ۶ ساعت</text>
 <rect x="410" y="405" width="235" height="82" rx="15" class="flow"/><text x="527" y="439" class="body bold">تحویل مشتری</text><text x="527" y="470" class="small muted">تا موعد وعده‌داده‌شده</text>
 <rect x="160" y="405" width="210" height="82" rx="15" fill="#183746" stroke="#438b84" stroke-width="2"/><text x="265" y="439" class="body bold">تیکت / پیگیری</text><text x="265" y="470" class="small muted">بازخورد و شکایت</text>
</g>
<path d="M1500 446H1481M1225 446H1206M950 446H931M675 446H656M400 446H381" class="line"/>
<text x="2220" y="527" text-anchor="end" class="tiny subtle">رویدادها: created → paid → picked → handed_over → delivered • لغو و بازپرداخت نیز ثبت می‌شوند</text>
<!-- Flow 2 -->
<rect x="145" y="565" width="2110" height="175" rx="22" fill="#10283d" stroke="#4978a9" stroke-width="2"/>
<rect x="2020" y="585" width="205" height="42" rx="20" fill="#203e5c"/><text x="2122" y="613" text-anchor="middle" class="small bold" fill="#9ac7f4">WF2 • شکایت</text>
<text x="2220" y="666" text-anchor="end" class="h2">شکایت تا حل</text>
<text x="2220" y="702" text-anchor="end" class="small muted">پاسخ‌گویی ← انبار / عملیات ← شکایات و مرجوعی</text>
<g text-anchor="middle">
 <rect x="1510" y="606" width="290" height="78" rx="15" class="flow"/><text x="1655" y="639" class="body bold">ثبت و دسته‌بندی تیکت</text><text x="1655" y="669" class="small muted">سفارش • موضوع • مشتری</text>
 <rect x="1155" y="606" width="290" height="78" rx="15" class="flow"/><text x="1300" y="639" class="body bold">پاسخ اول</text><text x="1300" y="669" class="small muted">SLA ≤ ۸ ساعت</text>
 <rect x="800" y="606" width="290" height="78" rx="15" class="flow"/><text x="945" y="639" class="body bold">بازرسی / اقدام عملیاتی</text><text x="945" y="669" class="small muted">SLA ≤ ۳۶ ساعت</text>
 <rect x="445" y="606" width="290" height="78" rx="15" class="flow"/><text x="590" y="639" class="body bold">حل پرونده</text><text x="590" y="669" class="small muted">SLA ≤ ۲۴ ساعت پس از بازرسی</text>
 <rect x="185" y="606" width="205" height="78" rx="15" fill="#183746" stroke="#527ca1" stroke-width="2"/><text x="287" y="639" class="body bold">CSAT / بازگشایی</text><text x="287" y="669" class="small muted">حلقه بازخورد</text>
</g>
<path d="M1500 645H1451M1145 645H1096M790 645H741M435 645H396" class="line"/>
<text x="2220" y="722" text-anchor="end" class="tiny subtle">هدف کل WF2: حل پرونده شکایات و مرجوعی ظرف ۴۸ ساعت</text>
<!-- Flow 3 -->
<rect x="145" y="760" width="2110" height="190" rx="22" fill="#2a2433" stroke="#956d9a" stroke-width="2"/>
<rect x="2020" y="780" width="205" height="42" rx="20" fill="#4b354f"/><text x="2122" y="808" text-anchor="middle" class="small bold" fill="#e2b9e7">WF3 • فروش B2B</text>
<text x="2220" y="862" text-anchor="end" class="h2">سرنخ تا قرارداد سازمانی</text>
<text x="2220" y="898" text-anchor="end" class="small muted">بازاریابی دیجیتال → فروش سازمانی</text>
<g text-anchor="middle">
 <rect x="1510" y="800" width="290" height="78" rx="15" class="flow"/><text x="1655" y="833" class="body bold">جذب سرنخ</text><text x="1655" y="863" class="small muted">کمپین • هزینه • کلیک • لید</text>
 <rect x="1155" y="800" width="290" height="78" rx="15" class="flow"/><text x="1300" y="833" class="body bold">تماس اول</text><text x="1300" y="863" class="small muted">SLA ≤ ۲۴ ساعت</text>
 <rect x="800" y="800" width="290" height="78" rx="15" class="flow"/><text x="945" y="833" class="body bold">احراز صلاحیت</text><text x="945" y="863" class="small muted">تا ۷۲ ساعت</text>
 <rect x="445" y="800" width="290" height="78" rx="15" class="flow"/><text x="590" y="833" class="body bold">ارسال پیشنهاد</text><text x="590" y="863" class="small muted">تا ۱۲۰ ساعت</text>
 <rect x="185" y="800" width="205" height="78" rx="15" fill="#3b2e42" stroke="#956d9a" stroke-width="2"/><text x="287" y="833" class="body bold">برد / باخت</text><text x="287" y="863" class="small muted">تا ۷۲۰ ساعت</text>
</g>
<path d="M1500 839H1451M1145 839H1096M790 839H741M435 839H396" class="line"/>
<text x="2220" y="931" text-anchor="end" class="tiny subtle">شاخص راهنما: درصد فرصت‌های بسته‌شده در SLA طی ۷ روز اخیر</text>
<!-- Lower panels -->
<rect x="1590" y="1025" width="710" height="470" rx="26" class="card" filter="url(#shadow)"/>
<text x="2245" y="1080" text-anchor="end" class="h2">چه کسانی و چه داده‌هایی؟</text>
<text x="2245" y="1120" text-anchor="end" class="small muted">مدیر ارشد: M01 • سه واحد و ۷ تیم عملیاتی</text>
<rect x="1940" y="1150" width="285" height="76" rx="18" class="chip"/><text x="2082" y="1182" text-anchor="middle" class="body bold">فروش • M02</text><text x="2082" y="1210" text-anchor="middle" class="small muted">سازمانی M05 • دیجیتال M06 • بازارگاه M11*</text>
<rect x="1630" y="1150" width="285" height="76" rx="18" class="chip"/><text x="1772" y="1182" text-anchor="middle" class="body bold">عملیات • M03</text><text x="1772" y="1210" text-anchor="middle" class="small muted">انبار M07 • ارسال M08</text>
<rect x="1940" y="1245" width="285" height="76" rx="18" class="chip"/><text x="2082" y="1277" text-anchor="middle" class="body bold">پشتیبانی • M04</text><text x="2082" y="1305" text-anchor="middle" class="small muted">پاسخ‌گویی M09 • شکایات M10</text>
<rect x="1630" y="1245" width="285" height="76" rx="18" class="chip"/><text x="1772" y="1277" text-anchor="middle" class="body bold">افراد / مدیران</text><text x="1772" y="1305" text-anchor="middle" class="small muted">مالک شاخص ← پایین‌ترین سطح مرتبط</text>
<text x="2245" y="1365" text-anchor="end" class="small bold" fill="#75d7c1">منابع داده‌ی روزانه</text>
<text x="2245" y="1402" text-anchor="end" class="small muted">سفارش و رویداد • CRM و قیف • تبلیغات و وب‌سشن</text>
<text x="2245" y="1435" text-anchor="end" class="small muted">تیکت و CSAT • وظیفه و مانع • ظرفیت کارکنان • تقویم و تصمیم‌ها</text>
<text x="2245" y="1470" text-anchor="end" class="tiny subtle">* تیم بازارگاه و مدیر M11 از روز ۷۵ به ساختار افزوده می‌شوند.</text>
<!-- Challenge -->
<rect x="845" y="1025" width="700" height="470" rx="26" fill="#30271f" stroke="#a67839" stroke-width="2" filter="url(#shadow)"/>
<text x="1490" y="1080" text-anchor="end" class="h2" fill="#f0c276">مسئله مدیریتی که باید حل شود</text>
<text x="1490" y="1122" text-anchor="end" class="body bold">دید پراکنده از عملکرد و مالکیت اقدام</text>
<text x="1490" y="1165" text-anchor="end" class="small">• رویدادهای یک سفارش بین سفارش، انبار، ارسال و تیکت پخش‌اند.</text>
<text x="1490" y="1203" text-anchor="end" class="small">• کمپین و سرنخ، ظرفیت تیم و مرخصی، کارهای عقب‌افتاده</text>
<text x="1490" y="1235" text-anchor="end" class="small">  و نتیجه تصمیم‌ها باید در یک روایت مدیریتی به هم وصل شوند.</text>
<text x="1490" y="1278" text-anchor="end" class="small">• داده‌ها شبانه، رویدادمحور و گاهی دیررس، تکراری یا ناقص‌اند؛</text>
<text x="1490" y="1310" text-anchor="end" class="small">  تعریف شاخص و دسترسی هم باید قابل اتکا و محدود بماند.</text>
<rect x="900" y="1352" width="590" height="94" rx="18" fill="#493820"/>
<text x="1455" y="1390" text-anchor="end" class="body bold" fill="#ffd58b">نیاز: دستیار ایجنتیک مدیران</text>
<text x="1455" y="1425" text-anchor="end" class="small">کشف زودهنگام → علت و شواهد → مالک درست → اقدام → پیگیری اثر</text>
<text x="1490" y="1474" text-anchor="end" class="tiny muted">اولویت جلسه مدیران: زمان تحویل • برآورد نیروی کمپین • تخلیه صف شکایات</text>
<!-- Governance loop -->
<rect x="100" y="1025" width="710" height="470" rx="26" class="card" filter="url(#shadow)"/>
<text x="755" y="1080" text-anchor="end" class="h2">حلقه نظارت، تصمیم و یادگیری</text>
<g text-anchor="middle">
 <rect x="535" y="1120" width="200" height="68" rx="16" class="chip"/><text x="635" y="1162" class="body bold">دریافت شبانه</text>
 <rect x="295" y="1120" width="200" height="68" rx="16" class="chip"/><text x="395" y="1162" class="body bold">کنترل کیفیت</text>
 <rect x="535" y="1220" width="200" height="68" rx="16" class="chip"/><text x="635" y="1262" class="body bold">گزارش صبحگاهی</text>
 <rect x="295" y="1220" width="200" height="68" rx="16" class="chip"/><text x="395" y="1262" class="body bold">تصمیم مدیر</text>
 <rect x="415" y="1320" width="200" height="68" rx="16" class="chip"/><text x="515" y="1362" class="body bold">وظیفه و پیگیری</text>
</g>
<path d="M525 1154H505M635 1198V1210M525 1254H505M395 1298l98 15" class="line"/>
<text x="755" y="1424" text-anchor="end" class="small muted">قواعد کلیدی: تعریف KPI ثابت • مقایسه با خط پایه</text>
<text x="755" y="1458" text-anchor="end" class="small muted">تشدید به مالک / مدیر مرتبط • بدون تکرار سیگنال ثابت</text>
<text x="755" y="1482" text-anchor="end" class="tiny subtle">داده فردی فقط برای سرپرست مستقیم؛ گزارش دیگران تجمیعی</text>
<!-- Footer -->
<text x="2280" y="1550" text-anchor="end" class="tiny subtle">مبنای ترسیم: بریف پروژه، README داده آرکا، تعاریف Workflow و ماتریس دسترسی • داده‌ها ساختگی و شبیه‌سازی‌شده‌اند.</text>
</svg>
