services:
  postgresql:
    image: postgres:18
    environment:
      POSTGRES_DB: orgpilot
      POSTGRES_USER: orgpilot_admin
      POSTGRES_PASSWORD: ${ORGPILOT_POSTGRES_PASSWORD:?Set ORGPILOT_POSTGRES_PASSWORD in .env}
      ORGPILOT_MIGRATOR_PASSWORD: ${ORGPILOT_MIGRATOR_PASSWORD:?Set ORGPILOT_MIGRATOR_PASSWORD in .env}
      ORGPILOT_API_PASSWORD: ${ORGPILOT_API_PASSWORD:?Set ORGPILOT_API_PASSWORD in .env}
      ORGPILOT_WORKER_PASSWORD: ${ORGPILOT_WORKER_PASSWORD:?Set ORGPILOT_WORKER_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgresql/10-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports:
      - "127.0.0.1:${ORGPILOT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  database-migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend-api
    command: ["--migrate"]
    environment:
      ConnectionStrings__Product: "Host=postgresql;Database=orgpilot;Username=orgpilot_migrator;Password=${ORGPILOT_MIGRATOR_PASSWORD};Timeout=5;GSS Encryption Mode=Disable"
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  worker-database-migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: background-worker
    command: ["--migrate"]
    environment:
      ConnectionStrings__Product: "Host=postgresql;Database=orgpilot;Username=orgpilot_migrator;Password=${ORGPILOT_MIGRATOR_PASSWORD};Timeout=5;GSS Encryption Mode=Disable"
      Archive__RootPath: /archive
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    restart: "no"

  backend-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Product: "Host=postgresql;Database=orgpilot;Username=orgpilot_api;Password=${ORGPILOT_API_PASSWORD};Timeout=5;GSS Encryption Mode=Disable"
      Archive__RootPath: /archive
      Observability__ExportEnabled: ${ORGPILOT_OTLP_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ORGPILOT_OTLP_ENDPOINT:-http://127.0.0.1:4317}
    volumes:
      - protected-archive:/archive
    ports:
      - "127.0.0.1:${ORGPILOT_API_PORT:-5080}:8080"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "OrgPilot.BackendApi.dll", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  background-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: background-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Product: "Host=postgresql;Database=orgpilot;Username=orgpilot_worker;Password=${ORGPILOT_WORKER_PASSWORD};Timeout=5;GSS Encryption Mode=Disable"
      Archive__RootPath: /archive
      Observability__ExportEnabled: ${ORGPILOT_OTLP_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ORGPILOT_OTLP_ENDPOINT:-http://127.0.0.1:4317}
    volumes:
      - protected-archive:/archive
    depends_on:
      worker-database-migrate:
        condition: service_completed_successfully

  scheduler-replay:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: scheduler-replay
    environment:
      DOTNET_ENVIRONMENT: Development
      Backend__BaseUrl: http://backend-api:8080
      Observability__ExportEnabled: ${ORGPILOT_OTLP_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ORGPILOT_OTLP_ENDPOINT:-http://127.0.0.1:4317}
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  postgres-data:
  protected-archive:
